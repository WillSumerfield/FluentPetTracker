<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metrics · FluentPet Board</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body data-page="Metrics">
  <header class="topbar">
    <h1>Metrics</h1>
    <div class="range" id="periods">
      <button data-period="day">Day</button>
      <button data-period="week">Week</button>
      <button data-period="month">Month</button>
      <button data-period="all">Whole study</button>
    </div>
    <div class="stepper">
      <button id="period-previous" title="The period before" aria-label="The period before">‹</button>
      <span class="period-label" id="period-label">…</span>
      <button id="period-next" title="The period after" aria-label="The period after">›</button>
    </div>
    <span class="status" id="status">Connecting…</span>
  </header>

  <div class="notice" id="notice" hidden></div>

  <main class="metrics">
    <nav class="metric-nav" aria-label="Groups of charts">
      <div class="metric-tabs" id="tabs" role="tablist"></div>
      <p class="tab-caption" id="tab-caption"></p>
      <div class="metric-search" id="search-box">
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search charts or Words…" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" disabled>
        <kbd class="search-key" title="Press / to search">/</kbd>
        <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      </div>
    </nav>

    <p class="hint" id="view-note" hidden></p>
    <div class="view-head" id="view-head" hidden>
      <h2 id="view-title"></h2>
      <button class="quiet" id="view-clear" title="Back to the tabs">✕ Clear</button>
    </div>

    <div id="sections" role="tabpanel"></div>
  </main>

  <script src="settings.js"></script>
  <script src="static/common.js"></script>
  <script src="static/metrics.js"></script>
</body>
</html>
