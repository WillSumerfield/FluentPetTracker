# The "Metrics" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. localhost works on the PC only.

title: Metrics
views:
  - title: Metrics
    path: metrics
    icon: mdi:chart-bar
    type: panel
    cards:
      - type: iframe
        url: http://localhost:8600/metrics
        aspect_ratio: 56%
