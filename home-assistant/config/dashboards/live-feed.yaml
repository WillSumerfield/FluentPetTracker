# The "Live Feed" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. It is kept in secrets.yaml, which is not committed,
# under the name fluentpet_live_url.

title: Live Feed
views:
  - title: Live Feed
    path: live-feed
    icon: mdi:cctv
    type: panel
    cards:
      - type: iframe
        url: !secret fluentpet_live_url
        allow: autoplay; fullscreen
