# The "Enrolment" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. It is kept in secrets.yaml, which is not committed,
# under the name fluentpet_enrol_url.

title: Enrolment
views:
  - title: Enrolment
    path: enrol
    icon: mdi:microphone-plus
    type: panel
    cards:
      - type: iframe
        url: !secret fluentpet_enrol_url
        allow: autoplay
