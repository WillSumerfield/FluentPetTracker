# The "Review" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. It is kept in secrets.yaml, which is not committed,
# under the name fluentpet_review_url.

title: Review
views:
  - title: Review
    path: review
    icon: mdi:account-question
    type: panel
    cards:
      - type: iframe
        url: !secret fluentpet_review_url
        allow: autoplay; fullscreen
