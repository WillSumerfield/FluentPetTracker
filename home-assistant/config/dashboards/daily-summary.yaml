# The "Daily Summary" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. It is kept in secrets.yaml, which is not committed,
# under the name fluentpet_daily_url.

title: Daily Summary
views:
  - title: Daily Summary
    path: daily-summary
    icon: mdi:paw
    type: panel
    cards:
      - type: iframe
        url: !secret fluentpet_daily_url
        allow: autoplay; fullscreen
