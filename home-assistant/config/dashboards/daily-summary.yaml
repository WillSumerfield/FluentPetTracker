# The "Daily Summary" entry in Home Assistant's sidebar: one of the Correlator's own pages.
# The address is opened by the browser, not by Home Assistant, so it must be reachable from
# the device showing the dashboard. localhost works on the PC only.

title: Daily Summary
views:
  - title: Daily Summary
    path: daily-summary
    icon: mdi:paw
    type: panel
    cards:
      - type: iframe
        url: http://localhost:8600/
        aspect_ratio: 56%
