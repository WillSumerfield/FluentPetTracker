mqtt:
  host: mosquitto
  port: 1883

detectors:
  cpu1:
    type: cpu

# Frigate holds footage for about an hour (1/24 of a day) and nothing longer.
# Clips kept for the study are cut from this by the Correlator.
record:
  enabled: true
  continuous:
    days: 0.042
  alerts:
    retain:
      days: 0.042
  detections:
    retain:
      days: 0.042

# Live Feed: Frigate relays the stream, with sound, to the dashboard's Live Feed page.
# The second line adds AAC sound when the camera's own sound cannot be played by a browser.
go2rtc:
  streams:
    board:
      - rtsp://mediamtx:8554/board
      - "ffmpeg:board#audio=aac"

cameras:
  board:
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/board
          roles:
            - detect
            - record
      output_args:
        record: preset-record-generic-audio-copy
    detect:
      enabled: true
      # Matches the stand-in video. Change to 1280x720 for the real camera.
      width: 640
      height: 360
      fps: 5
    objects:
      # A dog detection is treated as the cat: small cats get mislabelled.
      track:
        - person
        - cat
        - dog
    zones:
      # Placeholder drawn for the stand-in video. Redraw against the real camera.
      board_zone:
        coordinates: 0.25,0.25,1,0.25,1,1,0.25,1
        objects:
          - person
          - cat
          - dog
version: 0.18-0
