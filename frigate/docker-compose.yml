# Frigate Classification stack. Start it from the repository with:  ./fluentpet.sh up
# Settings come from the root config.yml, through files configure.py writes beside this one:
# .env (ports and folders), correlator.env and word-detection.env. Without them this stops.
# All ports are bound to 127.0.0.1, so nothing is reachable from other devices on the home network.
# The phone reaches Home Assistant, the Correlator's pages and Frigate's live stream through
# Tailscale Serve, which forwards to these same local ports (see the README).

services:
  # The stream everything here reads, at rtsp://mediamtx:8554/board. It relays the Pi's stream
  # (relay/). To go back to the looping stand-in video, mount ./standin/mediamtx.yml instead,
  # and set study.exchange_gap_seconds to 8 in config.yml, or its Exchanges never close.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./relay/mediamtx.yml:/mediamtx.yml:ro
      - ./standin/cat.mp4:/standin/cat.mp4:ro
    ports:
      - "127.0.0.1:${FP_PORT_RTSP:?run ./fluentpet.sh configure}:8554"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:${FP_PORT_MQTT:?run ./fluentpet.sh configure}:1883"

  # Word Detection: listens to the same stream and publishes Word events to the broker.
  word-detection:
    build: ../word-detection
    restart: unless-stopped
    user: "1000:1000" # so Reference Clips saved by Enrolment belong to the normal user, not root
    depends_on:
      - mediamtx
      - mosquitto
    env_file: word-detection.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Written by Enrolment, which is reached only through the Correlator's pages (port 8700,
      # inside this network).
      - ../word-detection/references:/references
      - ../word-detection/data:/data # an Enrolment Recording, until it is saved or discarded

  # Correlator: joins Word events with Board Zone presence into Presses, and cuts Clips.
  correlator:
    build: ../correlator
    restart: unless-stopped
    user: "1000:1000" # so the database and Clips belong to the normal user, not root
    depends_on:
      - mosquitto
      - frigate
      - word-detection
    env_file: correlator.env
    environment:
      CR_CLIPS_DIR: /clips
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${FP_DATA_DIR:?run ./fluentpet.sh configure}:/data
      # Clips are kept in storage.clips_dir. The folder must hold a .fluentpet-clips file;
      # without it, as when the drive is not connected, Clips are not saved, but Presses are.
      - ${FP_CLIPS_DIR:?run ./fluentpet.sh configure}:/clips
      - ./storage/exports:/frigate-exports:ro

  # The Correlator's web pages and API: figures, Clips and Review Decisions, shown inside
  # Home Assistant. Separate from the recording service, so a web fault cannot stop recording.
  correlator-web:
    build: ../correlator
    command: ["python", "-m", "correlator.web"]
    restart: unless-stopped
    user: "1000:1000"
    # No depends_on: rebuilding these pages must not restart the recording service.
    env_file: correlator.env # includes CR_PI_CONTROL_URL, for Pause and Resume at the Pi
    environment:
      CR_CLIPS_DIR: /clips
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${FP_DATA_DIR:?run ./fluentpet.sh configure}:/data
      - ${FP_CLIPS_DIR:?run ./fluentpet.sh configure}:/clips:ro
    ports:
      - "127.0.0.1:${FP_PORT_PAGES:?run ./fluentpet.sh configure}:8600" # dashboard pages and API, no login

  # Home Assistant Dashboard: shows the Correlator's pages in its sidebar and polls its figures.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    depends_on:
      - correlator-web
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../home-assistant/config:/config
    ports:
      - "127.0.0.1:${FP_PORT_HOME_ASSISTANT:?run ./fluentpet.sh configure}:8123" # web UI, login required

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    depends_on:
      - mediamtx
      - mosquitto
    stop_grace_period: 30s
    shm_size: "128mb"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "127.0.0.1:${FP_PORT_FRIGATE_LOGIN:?run ./fluentpet.sh configure}:8971" # web UI, login required
      - "127.0.0.1:${FP_PORT_FRIGATE:?run ./fluentpet.sh configure}:5000" # web UI and API, no login
